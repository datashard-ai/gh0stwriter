<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="491" viewBox="0 0 1000 491" role="img" aria-label="Installing gh0stwriter, saving the API key, recording a call, and the transcript that stop prints, in the terminal">
<rect width="100%" height="100%" rx="10" fill="#0d1117"/>
<rect width="1000" height="34" rx="10" fill="#161b22"/><rect y="24" width="1000" height="10" fill="#161b22"/>
<circle cx="20" cy="17" r="6" fill="#ff5f57"/><circle cx="40" cy="17" r="6" fill="#febc2e"/><circle cx="60" cy="17" r="6" fill="#28c840"/>
<text x="500.0" y="21.5" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#8b96a3">Terminal</text>
<g font-family="SFMono-Regular, Menlo, Consolas, Liberation Mono, monospace" font-size="13.5" xml:space="preserve">
<text x="24" y="52"><tspan fill="#ea0026">$</tspan><tspan fill="#f0f3f6"> curl -fsSL https://raw.githubusercontent.com/datashard-ai/gh0stwriter/main/install.sh | sh</tspan></text>
<text x="24" y="73" fill="#b6c0cc">Downloading gh0stwriter-aarch64-apple-darwin.tar.gz</text>
<text x="24" y="94" fill="#b6c0cc">Installed gh0stwriter 0.1.0 in /Users/you/.local/bin</text>
<text x="24" y="136"><tspan fill="#ea0026">$</tspan><tspan fill="#f0f3f6"> pbpaste | gh0stwriter config</tspan></text>
<text x="24" y="157" fill="#7ee2a8">Saved the API key to /Users/you/.config/gh0stwriter/config.toml</text>
<text x="24" y="199"><tspan fill="#ea0026">$</tspan><tspan fill="#f0f3f6"> gh0stwriter record --title "weekly sync"</tspan></text>
<text x="24" y="220" fill="#b6c0cc">/Users/you/gh0stwriter/2026-11-06-143000-weekly-sync</text>
<text x="24" y="241" fill="#8b96a3">Recording. Run `gh0stwriter stop` to finish.</text>
<text x="24" y="283"><tspan fill="#ea0026">$</tspan><tspan fill="#f0f3f6"> gh0stwriter stop</tspan></text>
<text x="24" y="304" fill="#f0f3f6">## Transcript</text>
<text x="24" y="346"><tspan fill="#8b96a3">[00:00]</tspan><tspan fill="#f0c674"> A:</tspan><tspan fill="#b6c0cc"> Thanks for joining. The first item is the launch date.</tspan></text>
<text x="24" y="367"><tspan fill="#8b96a3">[00:05]</tspan><tspan fill="#9ecbff"> B:</tspan><tspan fill="#b6c0cc"> We can ship on the 14th of March if the review lands this week.</tspan></text>
<text x="24" y="388"><tspan fill="#8b96a3">[00:11]</tspan><tspan fill="#f0c674"> A:</tspan><tspan fill="#b6c0cc"> Good. The budget stays at £40,000.</tspan></text>
<text x="24" y="430" fill="#8b96a3">---</text>
<text x="24" y="451" fill="#7ee2a8">Duration: 16 seconds | Speakers: 2</text>
</g></svg>
