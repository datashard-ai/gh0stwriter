<g font-size="17" font-weight="700" fill="#111111">
<text x="150" y="78" text-anchor="middle">Your Mac</text><text x="520" y="78" text-anchor="middle">sox</text><text x="890" y="78" text-anchor="middle">AssemblyAI EU API</text>
</g>
<g font-size="13" fill="#555b63" text-anchor="middle">
<text x="150" y="100">Microphone, or the other side</text><text x="150" y="119">of a call through BlackHole</text>
<text x="520" y="100">Records in the background,</text><text x="520" y="119">in a process group of its own</text>
<text x="890" y="100">Transcript with speaker labels</text><text x="890" y="119">English</text>
</g>
<g stroke="#808080" stroke-width="2" fill="#808080">
<line x1="262" y1="89" x2="397" y2="89"/><polygon points="409,89 395,82 395,96" stroke="none"/>
<line x1="632" y1="89" x2="767" y2="89"/><polygon points="779,89 765,82 765,96" stroke="none"/>
<line x1="520" y1="139" x2="520" y2="187"/><polygon points="520,199 513,185 527,185" stroke="none"/>
<line x1="890" y1="139" x2="890" y2="187"/><polygon points="890,199 883,185 897,185" stroke="none"/>
</g>
<g font-family="SFMono-Regular, Menlo, Consolas, Liberation Mono, monospace" font-size="12.5" fill="#ea0026" text-anchor="middle">
