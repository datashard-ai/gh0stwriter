<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="290" viewBox="0 0 1040 290" role="img" aria-label="How gh0stwriter works: record starts sox in the background, stop sends the audio to the AssemblyAI EU API, and the audio and the transcript are kept in a run folder on your Mac">
