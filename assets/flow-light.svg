</g>
<text x="520" y="228" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, Liberation Mono, monospace" font-size="14" font-weight="700" fill="#111111">~/gh0stwriter/2026-11-06-143000-weekly-sync/</text>
<text x="520" y="251" text-anchor="middle" font-size="13" fill="#555b63">Nothing deletes the audio. If a step fails, it stays here and gh0stwriter transcribe tries again.</text>
</g></svg>
